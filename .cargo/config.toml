# getrandom 0.3 refuses to build for wasm32-unknown-unknown unless it is told
# which browser API to use for entropy — the feature flag alone is not enough,
# it also needs this cfg. Scoped to the wasm target so native builds are
# untouched.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
