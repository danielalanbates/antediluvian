<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Antediluvia — a browser MMORPG. Explore the pre-flood world, fight mobs, and level up, right in your browser." />
    <meta name="theme-color" content="#0a0e14" />
    <title>Antediluvia</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0e14;
        color: #e6edf3;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        /* Mobile: the game owns all gestures — no pull-to-refresh. */
        overscroll-behavior: none;
      }
      /* Bevy creates its own canvas, appends it to <body>, and with
         fit_canvas_to_parent sizes it to the parent itself — so do not force
         dimensions here, or the render target and the displayed box disagree
         and mouse picking lands in the wrong place. */
      canvas {
        display: block;
        outline: none;
        /* Mobile: the game owns all touch gestures — no page scroll, pinch
           zoom, or double-tap zoom fighting the canvas. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* DOM text-entry overlay for touch devices (chat + character name).
         Bevy cannot summon the OS keyboard, so the game shows this real
         <input> instead. font-size is 16px: iOS Safari zooms the page on
         focus for anything smaller. It stays visibly tappable because iOS
         only summons the keyboard from a genuine user gesture. */
      #antediluvia-chatbar {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        display: none;
        gap: 8px;
        z-index: 20;
      }
      #antediluvia-chat-input {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        padding: 12px 14px;
        color: #e6edf3;
        background: rgba(10, 14, 20, 0.92);
        border: 2px solid #00d9ff;
        border-radius: 12px;
        outline: none;
      }
      #antediluvia-chat-send,
      #antediluvia-chat-cancel {
        flex: none;
        min-width: 56px;
        min-height: 48px;
        font-size: 15px;
        font-weight: 700;
        color: #0a0e14;
        background: #00d9ff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
      #antediluvia-chat-cancel {
        color: #e6edf3;
        background: #2a3442;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background: #0a0e14;
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 48px);
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #00d9ff;
      }
      #status { color: #8b98a5; min-height: 1.5em; }
      #bar {
        width: min(360px, 80vw);
        height: 4px;
        border-radius: 999px;
        background: #1b2430;
        overflow: hidden;
      }
      #bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: #00d9ff;
        transition: width 0.3s ease;
      }
      #hint { color: #55606d; font-size: 13px; max-width: 34em; }
      a { color: #00d9ff; }
      .fail { color: #ff6b6b; }
      #retry {
        display: none;
        margin-top: 4px;
        padding: 10px 28px;
        font-size: 15px;
        font-weight: 700;
        color: #0a0e14;
        background: #00d9ff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      #retry.show { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>Antediluvia</h1>
      <div id="bar"><i></i></div>
      <div id="status">Loading…</div>
      <div id="hint">
        First load pulls the whole game engine, so give it a moment — it is
        cached afterwards. WASD to move, mouse to look, Enter to chat.
      </div>
      <button id="retry" type="button">Try again</button>
    </div>

    <!-- Touch text entry (chat + character name). Hidden until the game shows
         it; the game focuses the field, and the page posts submitted text back
         into the wasm via the exported antediluvia_submit_overlay(). -->
    <div id="antediluvia-chatbar">
      <input id="antediluvia-chat-input" type="text" enterkeyhint="send"
             autocomplete="off" autocapitalize="sentences" autocorrect="off"
             spellcheck="false" maxlength="240" placeholder="Say something…" />
      <button id="antediluvia-chat-send" type="button">Send</button>
      <button id="antediluvia-chat-cancel" type="button" aria-label="Cancel">✕</button>
    </div>

    <script type="module">
      // Replaced at build time with a hash of the compiled engine; the literal
      // below is only what a hand-opened, unbuilt copy of this file would use.
      const BUILD_STAMP = '__BUILD_STAMP__';

      // The shard the client should dial. Left unset, the client derives
      // wss://<this-host>/ws, which is what we want in production; it is
      // declared here so a deploy can point at a different shard without a
      // rebuild.
      window.ANTEDILUVIA_SERVER = '';

      const statusEl = document.getElementById('status');
      const barEl = document.querySelector('#bar > i');
      const bootEl = document.getElementById('boot');

      // iOS Safari starts every AudioContext suspended and only resumes it
      // from a real user gesture; Bevy/rodio never resumes on its own, so the
      // game would be silent. Wrap the constructor (before the engine boots)
      // to track every context the game creates, and resume suspended ones on
      // every touch/click — kept persistent, not once, because iOS can
      // re-suspend on interruptions.
      const suspendedAudio = new Set();
      for (const key of ['AudioContext', 'webkitAudioContext']) {
        const Native = window[key];
        if (typeof Native !== 'function' || window[`__antediluvia_wrapped_${key}`]) continue;
        window[`__antediluvia_wrapped_${key}`] = true;
        window[key] = function (...args) {
          const ctx = new Native(...args);
          suspendedAudio.add(ctx);
          return ctx;
        };
      }
      const resumeAudio = () => {
        for (const ctx of suspendedAudio) {
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        }
      };
      window.addEventListener('touchstart', resumeAudio, { passive: true });
      window.addEventListener('touchend', resumeAudio, { passive: true });
      window.addEventListener('pointerdown', resumeAudio, { passive: true });

      // Touch devices get touch-first boot instructions.
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        document.getElementById('hint').textContent =
          'First load pulls the whole game engine, so give it a moment — it is ' +
          'cached afterwards. Left thumb to move, drag right side to look, tap the buttons to fight.';
      }

      // DOM text-entry overlay wiring (see #antediluvia-chatbar above). The
      // wasm module namespace is captured in boot(); these listeners only fire
      // on real user taps, after init() has succeeded.
      let wasmMod = null;
      const chatInput = document.getElementById('antediluvia-chat-input');
      const submitChat = () => {
        if (wasmMod) wasmMod.antediluvia_submit_overlay(chatInput.value);
        chatInput.value = '';
      };
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitChat(); }
      });
      document.getElementById('antediluvia-chat-send').addEventListener('click', submitChat);
      document.getElementById('antediluvia-chat-cancel').addEventListener('click', () => {
        if (wasmMod) wasmMod.antediluvia_cancel_overlay();
      });

      const setStatus = (text) => { statusEl.textContent = text; };
      const setProgress = (frac) => {
        barEl.style.width = `${Math.max(0, Math.min(1, frac)) * 100}%`;
      };

      async function boot() {
        setStatus('Downloading game engine…');

        // Stream the wasm so the progress bar reflects reality on the slow
        // first load, instead of sitting at zero for tens of seconds.
        // BUILD_STAMP is rewritten by scripts/build_web.sh with a hash of the
        // engine. It is what makes it safe for the host to cache pkg/ forever:
        // a new build requests a URL the browser has never seen.
        const res = await fetch(`./pkg/antediluvia_bg.wasm?v=${BUILD_STAMP}`);
        if (!res.ok) throw new Error(`engine download failed (${res.status})`);

        const total = Number(res.headers.get('Content-Length')) || 0;
        let loaded = 0;
        const chunks = [];
        const reader = res.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          // Without Content-Length (compressed responses often omit it) fall
          // back to an asymptotic curve so the bar still moves.
          setProgress(total ? loaded / total : 1 - Math.exp(-loaded / 2.5e7));
        }
        setProgress(1);
        setStatus('Starting…');

        const bytes = new Blob(chunks);
        wasmMod = await import(`./pkg/antediluvia.js?v=${BUILD_STAMP}`);
        const init = wasmMod.default;

        // Bevy runs its own loop from here and never returns control, so the
        // splash has to be dismissed by watching for the canvas rather than by
        // waiting on init().
        //
        // The try/catch below cannot see a hang: if init() never settles and
        // never creates a canvas, the page would sit on "Starting…" forever.
        // The watchdog turns that silent hang into a visible, retryable
        // failure instead.
        const watchdog = setTimeout(() => {
          if (!document.querySelector('canvas')) {
            fail('The game is taking too long to start.');
          }
        }, 90_000);
        const reveal = () => {
          if (document.querySelector('canvas')) {
            clearTimeout(watchdog);
            bootEl.classList.add('done');
          } else {
            requestAnimationFrame(reveal);
          }
        };
        reveal();

        try {
          await init({ module_or_path: await bytes.arrayBuffer() });
        } catch (err) {
          // winit hands control to the browser event loop by throwing. It says
          // so in the message, and it is the normal path — not a failure.
          if (!/Using exceptions for control flow/.test(String(err?.message ?? err))) {
            throw err;
          }
        }
      }

      const fail = (message) => {
        console.error(message);
        setProgress(0);
        statusEl.className = 'fail';
        setStatus(message);
        document.getElementById('hint').innerHTML =
          'The game needs WebGL2 and a recent browser. ' +
          'If this keeps happening, <a href="/antediluvia">read the status page</a>.';
        // A failed first load is often a transient network hiccup on the
        // ~20 MB engine download; offer a retry instead of a dead page.
        const retry = document.getElementById('retry');
        retry.classList.add('show');
        retry.addEventListener('click', () => location.reload(), { once: true });
      };

      boot().catch((err) => {
        fail(String(err && err.message ? err.message : err));
      });
    </script>
  </body>
</html>
